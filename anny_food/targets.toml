# Anny Food — weekly food-group targets by trimester.
#
# Source: Dietary Guidelines for Americans 2020–2025, Table 5-1, Healthy
# U.S.-Style Dietary Pattern for pregnant/lactating women at 2,000 kcal
# (T1 = baseline). T2/T3 scale the baseline by the DGA Chapter 5 calorie
# increases (+340 / +452 kcal → factors 1.170 / 1.226), per Ian's
# "Pregnancy Diet Planning.xlsx". A planning approximation, not an official
# per-trimester DGA pattern, and not medical advice.
#
# Editing: change numbers freely; the app reads this file on each load.
#   period = "day"  → target is per day; weekly target = value × 7
#   period = "week" → target is per week
#   kind   = "min"  → goal is to reach at least the value
#   kind   = "limit"→ value is a maximum (shown red when exceeded)
#   ceiling         → optional weekly hard max on a "min" row (seafood)
#   derived_from    → total computed from subgroups; never stored per recipe
#   enabled = false → row is kept for later and ignored by the app
#
# TODO(verify vs xlsx before T2, ~week 14): the workbook summary says refined
# grains are held at baseline, but the original prompt table scaled them to
# 3.8/4.0. Refined is a DGA "≤" amount, so it is a limit row held at 3.0 here.

[meta]
baseline_kcal = 2000
scale_factors = { t1 = 1.000, t2 = 1.170, t3 = 1.226 }
# Legumes count toward veg_legumes until its weekly target is met; the
# overflow counts as protein at this rate (¼ cup cooked beans = 1 oz eq).
legume_protein_oz_eq_per_cup_eq = 4.0
week_start = "monday"

# ---- Vegetables -------------------------------------------------------------

[[target]]
key = "veg_total"
label = "Vegetables (total)"
unit = "cup eq"
period = "day"
kind = "min"
t1 = 2.5
t2 = 2.9
t3 = 3.1
derived_from = ["veg_dark_green", "veg_red_orange", "veg_legumes", "veg_starchy", "veg_other"]

[[target]]
key = "veg_dark_green"
label = "Dark-green vegetables"
unit = "cup eq"
period = "week"
kind = "min"
t1 = 1.5
t2 = 1.8
t3 = 1.8
parent = "veg_total"

[[target]]
