# ---- Protein ----------------------------------------------------------------

[[target]]
key = "protein_total"
label = "Protein foods (total)"
unit = "oz eq"
period = "day"
kind = "min"
t1 = 5.5
t2 = 6.4
t3 = 6.7
# Plus any legume overflow (see meta.legume_protein_oz_eq_per_cup_eq).
derived_from = ["protein_meat_eggs", "protein_seafood", "protein_nuts_seeds_soy"]

[[target]]
key = "protein_meat_eggs"
label = "Meats, poultry, eggs"
unit = "oz eq"
period = "week"
kind = "min"
t1 = 26.0
t2 = 30.4
t3 = 31.9
parent = "protein_total"

[[target]]
key = "protein_seafood"
label = "Seafood (low-mercury)"
unit = "oz eq"
period = "week"
kind = "min"
t1 = 8.0
t2 = 9.4
t3 = 9.8
ceiling = 12.0   # FDA/EPA: 8–12 oz/week during pregnancy
parent = "protein_total"

[[target]]
key = "seafood_albacore"
label = "…of which albacore / white tuna"
unit = "oz eq"
period = "week"
kind = "limit"
# Ian's DGA-sourced cap. FDA's current fish chart puts albacore in "Good
# Choices" at 1 serving (~4 oz) per week — lower this to 4 to follow it.
t1 = 6.0
t2 = 6.0
t3 = 6.0
parent = "protein_seafood"
# Already counted inside protein_seafood; tracked only for the cap.
subset_of = "protein_seafood"

[[target]]
key = "protein_nuts_seeds_soy"
label = "Nuts, seeds, soy"
unit = "oz eq"
period = "week"
kind = "min"
t1 = 5.0
t2 = 5.9
t3 = 6.1
parent = "protein_total"

